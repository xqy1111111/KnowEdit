# Model
model_name: "/root/KnowEdit/hugging_cache/deepseek-r1d-qwen-7b"
model_class: AutoModelForCausalLM
tokenizer_class: AutoTokenizer
tokenizer_name: "/root/KnowEdit/hugging_cache/deepseek-r1d-qwen-7b"
model_parallel: false
inner_params:
  # DeepSeek-R1D-Qwen-7B 使用 Qwen2 架构，层数通常为 28（0..27），因此末三层为 25/26/27。
  - model.layers.25.mlp.gate_proj.weight
  - model.layers.25.mlp.up_proj.weight
  - model.layers.25.mlp.down_proj.weight
  - model.layers.26.mlp.gate_proj.weight
  - model.layers.26.mlp.up_proj.weight
  - model.layers.26.mlp.down_proj.weight
  - model.layers.27.mlp.gate_proj.weight
  - model.layers.27.mlp.up_proj.weight
  - model.layers.27.mlp.down_proj.weight

archive: null

# Method
alg: MEND
lr: 1e-6
edit_lr: 1e-4
lr_lr: 1e-4
seed: 42
cedit: 0.1
cloc: 1.0
cbase: 1.0
dropout: 0.0
train_base: False
no_grad_layers: null
one_sided: False
n_hidden: 1
hidden_dim: null
init: id
norm: True
combine: True
x_only: False
delta_only: False
act: relu
rank: 1920
mlp_class: IDMLP
shared: True

# Train
device: "cuda:0"
batch_size: 1
model_save_pt: 5000
silent: False
# max_epochs: 1
max_iters: 100000
log_interval: 1000
eval_log_interval: 1000
final_eval: True
val_interval: 1000
early_stop_patience: 20000
early_stop_key: "loss/total_edit_val"
eval_only: False
half: False
debug: False
save: True
verbose: True

val_batch_size: 5
accumulate_bs: 10
val_steps: 500
opt: Adam
grad_clip: 100.

# Output
results_dir: ./results
