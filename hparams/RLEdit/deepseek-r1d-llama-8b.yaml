alg_name: "RLEDIT"
model_name: "deepseek-ai/DeepSeek-R1-Distill-Llama-8B"
device: 0

# Focus top LLaMA MLP blocks (gate/up/down) for local edits
inner_params:
  - model.layers.29.mlp.gate_proj
  - model.layers.29.mlp.up_proj
  - model.layers.29.mlp.down_proj
  - model.layers.30.mlp.gate_proj
  - model.layers.30.mlp.up_proj
  - model.layers.30.mlp.down_proj
  - model.layers.31.mlp.gate_proj
  - model.layers.31.mlp.up_proj
  - model.layers.31.mlp.down_proj

# Hypernetwork training schedule (matches RLEdit/config defaults)
n_edits: 64
dataset_n_edits: 64
batch_size: 64
dataset_batch_size: 64
num_seq: 64
n_epochs: 3

# Adapter / optimizer knobs
token: "ans"
lr: 2.0e-6
reg_lambda: 1.0e-4
rank: 256
n_blocks: 2
meta_lr: 1.0e-5
editor_batch_size: 64
cache_dir: "/dev/shm/rledit_cache"
cleanup_cache: true

model_parallel: false
half: true
results_dir: ./results
