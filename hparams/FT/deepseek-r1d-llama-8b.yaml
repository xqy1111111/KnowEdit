# Fine-Tune (FT) for DeepSeek-R1-Distill-Llama-8B (single-sample editing)
alg_name: "FT"
model_name: "deepseek-ai/DeepSeek-R1-Distill-Llama-8B"
device: 0

# Pick a high layer for localized edits; you can try [29, 30, 31]
layers: [27]

num_steps: 25
batch_size: 1            # single editing requires bs=1
max_length: 4096
lr: 5e-4
weight_decay: 0.0
kl_factor: 0.0
norm_constraint: false

# "prompt_last" ~ FT-L; "target_new" ~ FT-M
objective_optimization: "target_new"

# LLaMA-style module templates
rewrite_module_tmp: "model.layers.{}.mlp.down_proj.weight"
layer_module_tmp:   "model.layers.{}"
mlp_module_tmp:     "model.layers.{}.mlp"
attn_module_tmp:    "model.layers.{}.self_attn"
ln_f_module:        "model.norm"
lm_head_module:     "lm_head"

model_parallel: false

