alg_name: "WISE"
model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"

# 单卡编辑用哪张 GPU（torchrun 情况下会被自动覆盖为 local_rank）
device: 0

# WISE 关键超参（在 7B 上较稳健）
mask_ratio: 0.18
edit_lr: 0.50
n_iter: 100
norm_constraint: 0.5
act_margin: [3.0, 12.0, 6.0]   # alpha, beta, gamma
act_ratio: 0.86
save_freq: 500
merge_freq: 1000
merge_alg: 'ties'
objective_optimization: 'only_label'

# 作用层（Qwen2 7B/R1D 共有 28 层，索引 0..27；选靠后层收敛更稳定）
inner_params:
  - model.layers[27].mlp.down_proj.weight

# 可选：合并/检索
densities: 0.52
weights: 1.0
retrieve: False
replay: False

model_parallel: False
use_chat_template: True

# 可选：跨样本持久化（共享记忆）
# save_path: "./outputs/wise_qwen7b/wise.pt"
# load_path: "./outputs/wise_qwen7b/wise.pt"
