alg_name: "WISE"
model_name: "deepseek-ai/DeepSeek-R1-Distill-Llama-8B"

device: 0

# 8B 稍大，学习率略降，迭代略增
mask_ratio: 0.15
edit_lr: 0.35
n_iter: 120
norm_constraint: 0.3
act_margin: [2.0, 8.0, 4.0]
act_ratio: 0.85
save_freq: 500
merge_freq: 1000
merge_alg: 'ties'
objective_optimization: 'only_label'

# Llama 8B 为 32 层（0..31），选择靠后层
inner_params:
  - model.layers[27].mlp.down_proj.weight

densities: 0.50
weights: 1.0
retrieve: False
replay: False

model_parallel: False
use_chat_template: True

# 可选：持久化共享
# save_path: "./outputs/wise_llama8b/wise.pt"
# load_path: "./outputs/wise_llama8b/wise.pt"
