alg_name: "DPO"
model_name: "deepseek-ai/DeepSeek-R1-Distill-Llama-8B"
device: 0

# LoRA config
lora_type: "lora"           # current impl uses LoraConfig
layers: []                  # empty -> apply to all layers for target_modules
target_modules: ["q_proj", "v_proj"]
rank: 8
lora_alpha: 32
lora_dropout: 0.1

# Train schedule
num_steps: 7
batch_size: 1               # single-sample editing pipeline
lr: 5e-5
weight_decay: 0
kl_factor: 0
norm_constraint: false

# Sequence / misc
max_length: 2048
model_parallel: false

# DPO mixture: loss = alpha*lora_loss + (1-alpha)*dpo_loss
alpha: 0.99
beta: 0.1

